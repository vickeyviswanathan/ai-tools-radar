name: Deploy AI Radar to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Run every 6 hours automatically to refresh the leaderboard
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Gate (Zero CVEs Allowed)
        run: npm audit --audit-level=low

      - name: Run Thought-Leader Curated Ingest Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          GOOGLE_SHEET_EDIT_URL: ${{ secrets.GOOGLE_SHEET_EDIT_URL }}
        run: node build-static.mjs

      - name: Run Strict Quality, Safety & Anti-Junk Gate
        run: npm test

      - name: Persist Newsletter Sent Ledger (Prevent Any Repeat Scam/Tool/Reality)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Cipherati Bot"
          git config user.email "briefing@cipherati.com"
          git add public/data/newsletter-sent-ledger.json
          git diff --staged --quiet || git commit -m "chore(newsletter): update sent-items ledger [skip ci]"
          git push origin HEAD:main || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
